# WebChat AI - production stack (Phase 16)
# Canonical deployment: nginx reverse proxy -> API + Dashboard + Widget.
# Usage:
#   export TAG=v1.0.0
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# Environment: every required variable must be provided (the `:?` marker makes
# compose fail fast when one is missing). Load them from your secret manager /
# CI environment - never commit a .env with production secrets. A fillable
# template lives at .env.production.example.
#
# External dependencies (managed outside this stack):
#   * MongoDB Atlas (M7+ with Vector Search)          -> MONGODB_URI
#   * Redis (Upstash / Redis Cloud with TLS)          -> REDIS_URL
#   * Resend (email delivery)                         -> RESEND_API_KEY
#
# Single-origin routing (see docs/DEPLOYMENT.md):
#   nginx:80|443  /api/*    -> api:8000   (override via NGINX_API_UPSTREAM)
#                  /widget/* -> widget:80  (override via NGINX_WIDGET_UPSTREAM)
#                  /*         -> dashboard:3000 (override via NGINX_DASHBOARD_UPSTREAM)
# The nginx image also runs as the Railway public gateway (PORT + upstream env
# vars + ENABLE_TLS=0); see docs/RAILWAY_DEPLOYMENT.md.
# TLS is optional via ENABLE_TLS=1 with certs mounted at ./tls (or TLS_CERT_DIR).

name: webchat-ai-prod

x-app-env: &app-env
  ENVIRONMENT: production
  DEBUG: "false"

  # --- Security ---
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (>=32 bytes, openssl rand -hex 32)}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  # Trusted-proxy deployments only. Set false when the API is exposed directly.
  TRUST_PROXY: ${TRUST_PROXY:-true}
  RATE_LIMIT_ENABLED: "true"
  # Host-header allowlist enforced by TrustedHostMiddleware (Phase 16). Accepts
  # a comma-separated list or JSON array. Must include the public hostname(s).
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required (public hostname(s), e.g. app.example.com)}
  # Per-API-key sliding window (Sprint 2).
  API_KEY_RATE_LIMIT_PER_MINUTE: ${API_KEY_RATE_LIMIT_PER_MINUTE:-300}

  # --- Database ---
  MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required (Atlas mongodb+srv://...)}
  MONGODB_DB: ${MONGODB_DB:-webchat_ai}
  MONGODB_MIN_POOL_SIZE: ${MONGODB_MIN_POOL_SIZE:-10}
  MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-100}
  MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-30000}

  # --- Redis ---
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required (TLS RESP URL)}
  REDIS_PREFIX: ${REDIS_PREFIX:-webchat_ai}

  # --- CORS / public URLs ---
  # Single-origin deployments: every origin here equals the public hostname.
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required (JSON array of dashboard origins)}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required (production dashboard origin)}
  WIDGET_SCRIPT_URL: ${WIDGET_SCRIPT_URL:?WIDGET_SCRIPT_URL is required (HTTPS content-hashed widget bundle)}
  WIDGET_API_BASE_URL: ${WIDGET_API_BASE_URL:?WIDGET_API_BASE_URL is required (HTTPS API origin for embeds)}

  # --- Email (Resend) ---
  RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
  EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required (verified Resend sender)}

  # --- AI generation (at least one key required; see config.py validator) ---
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct}
  GENERATION_PROVIDER_ORDER: ${GENERATION_PROVIDER_ORDER:-["gemini","groq","openrouter"]}
  AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-60}

  # --- Embeddings (dimensions MUST match the Atlas vector index) ---
  EMBEDDING_PROVIDER_ORDER: ${EMBEDDING_PROVIDER_ORDER:-["gemini"]}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-3072}

  # --- Widget API limits (production hardening) ---
  WIDGET_SESSION_TOKEN_MINUTES: ${WIDGET_SESSION_TOKEN_MINUTES:-15}
  WIDGET_SESSION_VALIDITY_HOURS: ${WIDGET_SESSION_VALIDITY_HOURS:-24}
  WIDGET_CONFIG_CACHE_SECONDS: ${WIDGET_CONFIG_CACHE_SECONDS:-300}
  WIDGET_PER_WIDGET_LIMIT: ${WIDGET_PER_WIDGET_LIMIT:-60}
  WIDGET_PER_VISITOR_LIMIT: ${WIDGET_PER_VISITOR_LIMIT:-20}
  WIDGET_SESSION_ISSUE_LIMIT: ${WIDGET_SESSION_ISSUE_LIMIT:-30}
  WIDGET_FEEDBACK_LIMIT: ${WIDGET_FEEDBACK_LIMIT:-30}
  WIDGET_IP_LIMIT: ${WIDGET_IP_LIMIT:-120}
  WIDGET_MAX_MESSAGES_PER_SESSION: ${WIDGET_MAX_MESSAGES_PER_SESSION:-50}
  WIDGET_RATE_LIMIT_ENABLED: "true"

  # --- Observability (keep off in production) ---
  PERF_TIMING_LOG_ENABLED: ${PERF_TIMING_LOG_ENABLED:-false}

  # --- Payments (Phase 14; config.py fails fast without a real gateway) ---
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:?PAYMENT_PROVIDER is required in production (stripe or razorpay)}
  PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-USD}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}

  # --- Platform operations (Phase 15) ---
  # Comma-separated emails granted `super_admin`; empty = admin API disabled.
  SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}

services:
  api:
    image: ${REGISTRY:-ghcr.io/${ORG:-your-org}/webchat-api}:${TAG:-v1.0.0}
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      # Build with host networking (documented Docker MTU/VPN issue): outbound
      # TLS from the default build bridge can drop oversized packets.
      network: host
    container_name: webchat-api-prod
    # tini init reaps zombie children (Audit 17).
    init: true
    networks: [webchat]
    restart: unless-stopped
    environment: *app-env
    expose:
      - "8000"
    healthcheck:
      # Fail-closed readiness: 200 only when Mongo + Redis are reachable.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: ${REGISTRY:-ghcr.io/${ORG:-your-org}/webchat-worker}:${TAG:-v1.0.0}
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      network: host
    container_name: webchat-worker-prod
    # Playwright launches Chromium; init reaps child processes.
    init: true
    networks: [webchat]
    restart: unless-stopped
    environment: *app-env
    healthcheck:
      # Worker has no HTTP endpoint; liveness = the ARQ process is up and can
      # reach the Redis broker.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os; from redis import Redis; assert Redis.from_url(os.environ['REDIS_URL']).ping()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  dashboard:
    image: ${REGISTRY:-ghcr.io/${ORG:-your-org}/webchat-dashboard}:${TAG:-v1.0.0}
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
      network: host
      args:
        # Baked into the client bundle at build time (B2 fix). Must be the
        # public HTTPS origin reachable from the browser. In the single-origin
        # deployment this equals the dashboard origin (nginx routes /api/*).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required (public API origin)}
    container_name: webchat-dashboard-prod
    init: true
    networks: [webchat]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  widget:
    image: ${REGISTRY:-ghcr.io/${ORG:-your-org}/webchat-widget}:${TAG:-v1.0.0}
    build:
      context: .
      dockerfile: docker/Dockerfile.widget
      network: host
      args:
        # Baked into the SDK bundle at build time; the same origin as
        # WIDGET_API_BASE_URL so `data-api-base-url` and the bundle agree.
        VITE_WIDGET_API_BASE_URL: ${WIDGET_API_BASE_URL:?WIDGET_API_BASE_URL is required (public API origin)}
    container_name: webchat-widget-prod
    init: true
    networks: [webchat]
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "--spider",
          "http://127.0.0.1/webchat-widget.iife.min.js",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Reverse proxy / edge (Phase 16) ---
  nginx:
    image: ${REGISTRY:-ghcr.io/${ORG:-your-org}/webchat-nginx}:${TAG:-v1.0.0}
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
      network: host
    container_name: webchat-nginx-prod
    networks: [webchat]
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:${PORT:-80}"
      - "${HTTPS_PORT:-443}:${NGINX_HTTPS_PORT:-443}"
    environment:
      # 1 -> serve the TLS vhost (certs must be mounted below); 0 -> plain HTTP.
      ENABLE_TLS: ${ENABLE_TLS:-0}
      # Container listen port. Railway injects PORT; compose defaults to 80.
      PORT: ${PORT:-80}
      NGINX_HTTPS_PORT: ${NGINX_HTTPS_PORT:-443}
      # Gateway upstreams (host:port). Compose defaults target the services in
      # this file; on Railway point these at the private service URLs.
      NGINX_API_UPSTREAM: ${NGINX_API_UPSTREAM:-api:8000}
      NGINX_WIDGET_UPSTREAM: ${NGINX_WIDGET_UPSTREAM:-widget:80}
      NGINX_DASHBOARD_UPSTREAM: ${NGINX_DASHBOARD_UPSTREAM:-dashboard:3000}
    volumes:
      # Read-only certs for the optional TLS vhost: fullchain.pem + privkey.pem.
      - ${TLS_CERT_DIR:-./tls}:/etc/nginx/tls:ro
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      widget:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  webchat:
    driver: bridge
