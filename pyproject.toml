[project]
name = "backend"
version = "0.1.0"
description = "WebChat AI backend - FastAPI multi-tenant RAG SaaS API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arq>=0.26",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "motor>=3.6",
    "playwright>=1.49",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "redis>=5.2",
    "resend>=0.9",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.13"
strict = true
disable_error_code = ["import-untyped", "import-not-found"]
