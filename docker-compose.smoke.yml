# WebChat AI - CI smoke test for the production stack (Phase 16)
# Composes docker-compose.prod.yml (all prod services incl. nginx) with local
# Mongo + Redis so the whole stack boots with production-valid dummy secrets.
# Driven by .github/workflows/ci.yml (prod-smoke job).
#
# Usage (CI only):
#   export JWT_SECRET=... MONGODB_URI=mongodb://mongo:27017 REDIS_URL=redis://redis:6379 \
#          CORS_ORIGINS='["https://app.example.test"]' ALLOWED_HOSTS=app.example.test ... (see ci.yml)
#   docker compose -f docker-compose.smoke.yml up -d --wait
#   curl http://127.0.0.1/api/health/ready

name: webchat-ai-smoke

include:
  - path: docker-compose.prod.yml

services:
  mongo:
    image: mongo:7
    container_name: webchat-smoke-mongo
    networks: [webchat]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: webchat-smoke-redis
    networks: [webchat]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

networks:
  webchat:
    driver: bridge
