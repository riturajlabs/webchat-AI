# WebChat AI - production reverse proxy (Phase 16)
# Single entry point: /api -> API, /widget -> widget SDK host, / -> dashboard.
# TLS is optional (ENABLE_TLS) via conf.d/tls.conf; certs are mounted read-only
# at /etc/nginx/tls. Security headers live here AND in the app (API sends its
# own via SecurityHeadersMiddleware); these cover the static dashboard/widget.

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide the nginx version in Server headers and error pages.
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Bound request bodies (dashboard + widget + API uploads).
    client_max_body_size 25m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # --- Compression ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    # --- Edge rate limiting (backup for the app-level limiters) ---
    # API (dashboard + widget traffic share this path; app-level per-key and
    # per-widget budgets still apply downstream).
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    # Auth endpoints: aggressive - brute-force / credential-stuffing defense.
    limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=5r/m;
    # Widget SDK asset fetches.
    limit_req_zone $binary_remote_addr zone=widget_assets:10m rate=120r/m;

    # --- Security headers applied to every response (server level) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # CSP stays at the app layer: a global 'none' default would break the
    # Next.js SPA, and the API already sends its own CSP.

    include /etc/nginx/conf.d/*.conf;
}
