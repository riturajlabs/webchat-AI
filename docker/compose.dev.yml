# WebChat AI - local development stack
# MongoDB Atlas + local Redis + Mailpit

name: webchat-ai

networks:
  webchat:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: ${DOCKER_BRIDGE_MTU:-1500}

services:

  redis:
    image: redis:7-alpine
    container_name: webchat-redis
    networks: [webchat]
    restart: unless-stopped

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  mailpit:
    image: axllent/mailpit:v1.20
    container_name: webchat-mailpit
    networks: [webchat]
    restart: unless-stopped

    ports:
      - "1025:1025"
      - "8025:8025"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://localhost:8025/api/v1/info"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      network: host

    container_name: webchat-api
    networks: [webchat]
    restart: unless-stopped


    environment:

      ENVIRONMENT: development
      DEBUG: "true"

      # MongoDB Atlas
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB: ${MONGODB_DB:-webchat_ai}


      # Redis
      REDIS_URL: redis://redis:6379


      CORS_ORIGINS: '["http://localhost:3000"]'


      JWT_SECRET: dev-only-jwt-secret-change-me

      COOKIE_SECURE: "false"

      PUBLIC_BASE_URL:
        http://localhost:3000


      MAILPIT_API_URL:
        http://mailpit:8025


      GEMINI_API_KEY:
        ${GEMINI_API_KEY:-}


      RATE_LIMIT_ENABLED:
        ${RATE_LIMIT_ENABLED:-true}


    ports:
      - "8000:8000"


    depends_on:

      redis:
        condition: service_healthy


    healthcheck:

      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s



  worker:

    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
      network: host


    container_name: webchat-worker

    networks: [webchat]

    restart: unless-stopped


    environment:

      ENVIRONMENT: development


      # MongoDB Atlas
      MONGODB_URI: ${MONGODB_URI}

      MONGODB_DB: ${MONGODB_DB:-webchat_ai}


      REDIS_URL:
        redis://redis:6379


      MAILPIT_API_URL:
        http://mailpit:8025


      GEMINI_API_KEY:
        ${GEMINI_API_KEY:-}



    depends_on:

      redis:
        condition: service_healthy



  dashboard:

    build:

      context: ..

      dockerfile: docker/Dockerfile.dashboard

      network: host


    container_name: webchat-dashboard

    networks: [webchat]

    restart: unless-stopped


    environment:

      NODE_ENV: production

      PORT: 3000

      PUBLIC_BASE_URL:
        http://localhost:3000



    ports:

      - "3000:3000"



    depends_on:

      api:

        condition: service_healthy



    healthcheck:

      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3000"
        ]

      interval: 10s
      timeout: 5s
      retries: 5



  widget:

    build:

      context: ..

      dockerfile: docker/Dockerfile.widget

      network: host


      args:

        VITE_WIDGET_API_BASE_URL:
          ${VITE_WIDGET_API_BASE_URL:-}



    container_name: webchat-widget

    networks: [webchat]

    restart: unless-stopped


    ports:

      - "8080:80"



    healthcheck:

      test:

        [
          "CMD",
          "wget",
          "-qO-",
          "--spider",
          "http://127.0.0.1/webchat-widget.iife.min.js"
        ]

      interval: 10s

      timeout: 5s

      retries: 5



volumes:

  redis_data: