# Static host for the WebChat AI widget SDK bundles (dist/*.js).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Bundles are content-addressed/immutable build artifacts.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
}
