# Static host for the WebChat AI widget SDK bundles (dist/*.js).
#
# The bundles are content-hashed build artifacts (`webchat-widget.iife.min.<hash>.js`
# etc.), so hashed files are safe to cache immutable for a year. Stable-name
# copies (`webchat-widget.iife.min.js`) exist for dev/e2e/package entry points
# and are revalidated on every load so they never go stale.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Content-addressed bundles and their sourcemaps: immutable for a year.
    # Matches `webchat-widget.iife.min.<hash>.js`, `webchat-widget.<hash>.js`,
    # `webchat-widget.umd.<hash>.cjs` and their `.map` siblings.
    location ~* "^/.+\.iife\.min\.[A-Za-z0-9_-]{8,}\.(js|map|js\.map)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~* "^/.+\.umd\.[A-Za-z0-9_-]{8,}\.(cjs|map|cjs\.map)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~* "^/webchat-widget\.[A-Za-z0-9_-]{8,}\.(js|map|js\.map)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else (stable-name copies, any other file): always revalidate.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }
}
