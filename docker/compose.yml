# WebChat AI - full stack (MongoDB + Redis + Mailpit + API + Worker + Dashboard + Widget).
# Select the environment file; compose consumes it and NEVER overrides it:
#   docker compose --env-file .env.development -f docker/compose.yml up --build
#   docker compose --env-file .env.production  -f docker/compose.yml up --build
# (or scripts/docker-up.sh).
#
# Interpolation uses ${VAR-default} (default only when the variable is UNSET)
# rather than ${VAR:-default} (default when unset OR EMPTY) so an explicit
# empty value in the selected env file is preserved. This matters for e.g.
# .env.production, where MAILPIT_API_URL= is intentionally empty: with `:-` it
# would silently fall back to the local Mailpit service.
#
# The api/worker containers receive the full backend environment. Values come
# from the selected env file; the defaults below are ONLY for a bare
# `docker compose up` with no env file (local development services).
#
# Build-time variables (baked into bundles, cannot be changed at runtime):
#   dashboard  -> NEXT_PUBLIC_API_URL  (Next.js, see Dockerfile.dashboard)
#   widget     -> VITE_WIDGET_API_BASE_URL (Vite, see Dockerfile.widget)

name: webchat-ai

# Shared backend environment (api + worker). Every variable maps to
# backend/core/config.py or a compose runtime value; see .env.example.
x-backend-env: &backend-env
  # Mode / debug are .env-driven (default: development / true).
  ENVIRONMENT: ${ENVIRONMENT-development}
  DEBUG: ${DEBUG-true}
  PERF_TIMING_LOG_ENABLED: ${PERF_TIMING_LOG_ENABLED-false}
  APP_NAME: ${APP_NAME-webchat-ai}
  # Explicit local production testing; false by default, NEVER auto-enabled.
  LOCAL_PRODUCTION_TEST: ${LOCAL_PRODUCTION_TEST-false}
  BACKEND_HOST: ${BACKEND_HOST-0.0.0.0}
  BACKEND_PORT: ${BACKEND_PORT-8000}

  # Database is .env-driven; falls back to the local `mongo` service.
  MONGODB_URI: ${MONGODB_URI-mongodb://mongo:27017}
  MONGODB_DB: ${MONGODB_DB-webchat_ai}
  MONGODB_MIN_POOL_SIZE: ${MONGODB_MIN_POOL_SIZE-10}
  MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE-100}
  MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS-30000}
  MONGODB_SLOW_QUERY_THRESHOLD_MS: ${MONGODB_SLOW_QUERY_THRESHOLD_MS-0}

  # Redis is .env-driven; falls back to the local `redis` service.
  REDIS_URL: ${REDIS_URL-redis://redis:6379}
  REDIS_PREFIX: ${REDIS_PREFIX-webchat_ai}

  # Auth (from .env when present; safe dev fallback otherwise).
  JWT_SECRET: ${JWT_SECRET-dev-only-jwt-secret-change-me-please}
  JWT_ALGORITHM: ${JWT_ALGORITHM-HS256}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES-15}
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS-30}
  COOKIE_SECURE: ${COOKIE_SECURE-false}
  REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME-refresh_token}
  CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME-csrf_token}
  EMAIL_VERIFY_TOKEN_EXPIRE_MINUTES: ${EMAIL_VERIFY_TOKEN_EXPIRE_MINUTES-1440}
  PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES-30}

  # Account lockout (SEC-3).
  LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS-5}
  LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES-15}

  # Rate limiting.
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED-true}
  API_KEY_RATE_LIMIT_PER_MINUTE: ${API_KEY_RATE_LIMIT_PER_MINUTE-300}
  REFRESH_RATE_LIMIT_PER_MINUTE: ${REFRESH_RATE_LIMIT_PER_MINUTE-30}

  # Reverse-proxy trust + trusted hosts (production validation in config.py).
  TRUST_PROXY: ${TRUST_PROXY-false}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS-localhost,127.0.0.1,0.0.0.0,::1}

  # CORS / public URLs.
  CORS_ORIGINS: ${CORS_ORIGINS-["http://localhost:3000","http://localhost:8000","http://127.0.0.1:5500","http://localhost:5500"]}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL-http://localhost:3000}
  WIDGET_SCRIPT_URL: ${WIDGET_SCRIPT_URL-http://localhost:8080/webchat-widget.iife.min.js}
  # Runtime widget API origin (rendered into the embed snippet as
  # data-api-base-url). The build-time VITE_WIDGET_API_BASE_URL stays empty for
  # local runs so the bundle remains loopback-free (check-assets gate).
  WIDGET_API_BASE_URL: ${WIDGET_API_BASE_URL-http://localhost:8000}

  # Public widget API limits.
  WIDGET_SESSION_TOKEN_MINUTES: ${WIDGET_SESSION_TOKEN_MINUTES-15}
  WIDGET_SESSION_VALIDITY_HOURS: ${WIDGET_SESSION_VALIDITY_HOURS-24}
  WIDGET_CONFIG_CACHE_SECONDS: ${WIDGET_CONFIG_CACHE_SECONDS-300}
  WIDGET_PER_WIDGET_LIMIT: ${WIDGET_PER_WIDGET_LIMIT-60}
  WIDGET_PER_VISITOR_LIMIT: ${WIDGET_PER_VISITOR_LIMIT-20}
  WIDGET_SESSION_ISSUE_LIMIT: ${WIDGET_SESSION_ISSUE_LIMIT-30}
  WIDGET_SESSION_ISSUE_IP_LIMIT: ${WIDGET_SESSION_ISSUE_IP_LIMIT-30}
  WIDGET_FEEDBACK_LIMIT: ${WIDGET_FEEDBACK_LIMIT-30}
  WIDGET_CHAT_IP_LIMIT: ${WIDGET_CHAT_IP_LIMIT-60}
  WIDGET_IP_LIMIT: ${WIDGET_IP_LIMIT-120}
  WIDGET_MAX_MESSAGES_PER_SESSION: ${WIDGET_MAX_MESSAGES_PER_SESSION-50}
  WIDGET_RATE_LIMIT_ENABLED: ${WIDGET_RATE_LIMIT_ENABLED-true}

  # Email: .env-driven; falls back to the local Mailpit service. Production
  # uses Resend (RESEND_API_KEY) and leaves MAILPIT_API_URL empty (preserved).
  MAILPIT_API_URL: ${MAILPIT_API_URL-http://mailpit:8025}
  RESEND_API_KEY: ${RESEND_API_KEY-}
  EMAIL_FROM: ${EMAIL_FROM-WebChat AI <no-reply@webchatai.example>}

  # AI keys / models (from .env when present).
  GEMINI_API_KEY: ${GEMINI_API_KEY-}
  GEMINI_MODEL: ${GEMINI_MODEL-gemini-2.5-flash}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL-gemini-embedding-001}
  GROQ_API_KEY: ${GROQ_API_KEY-}
  GROQ_MODEL: ${GROQ_MODEL-llama-3.3-70b-versatile}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL-meta-llama/llama-3.3-70b-instruct}
  GENERATION_PROVIDER_ORDER: ${GENERATION_PROVIDER_ORDER-["gemini","groq","openrouter"]}
  EMBEDDING_PROVIDER_ORDER: ${EMBEDDING_PROVIDER_ORDER-["gemini","jina","cohere"]}
  AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS-60}
  AI_PROVIDER_ROUTING_MODE: ${AI_PROVIDER_ROUTING_MODE-static}
  AI_PROVIDER_COOLDOWN_SECONDS: ${AI_PROVIDER_COOLDOWN_SECONDS-60}
  AI_PROVIDER_HEALTH_CHECK_INTERVAL: ${AI_PROVIDER_HEALTH_CHECK_INTERVAL-300}
  AI_PROVIDER_RECOVERY_WINDOW_SECONDS: ${AI_PROVIDER_RECOVERY_WINDOW_SECONDS-120}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS-1024}
  GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS-1024}
  JINA_API_KEY: ${JINA_API_KEY-}
  JINA_EMBEDDING_MODEL: ${JINA_EMBEDDING_MODEL-jina-embeddings-v3}
  JINA_EMBEDDING_DIMENSIONS: ${JINA_EMBEDDING_DIMENSIONS-1024}
  COHERE_API_KEY: ${COHERE_API_KEY-}
  COHERE_EMBEDDING_MODEL: ${COHERE_EMBEDDING_MODEL-embed-multilingual-v3.0}
  COHERE_EMBEDDING_DIMENSIONS: ${COHERE_EMBEDDING_DIMENSIONS-1024}

  # Knowledge processing.
  KNOWLEDGE_CHUNK_SIZE_TOKENS: ${KNOWLEDGE_CHUNK_SIZE_TOKENS-700}
  KNOWLEDGE_CHUNK_OVERLAP_TOKENS: ${KNOWLEDGE_CHUNK_OVERLAP_TOKENS-100}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE-32}
  EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES-5}
  EMBEDDING_RETRY_BASE_DELAY_MS: ${EMBEDDING_RETRY_BASE_DELAY_MS-500}
  EMBEDDING_REQUEST_TIMEOUT_SECONDS: ${EMBEDDING_REQUEST_TIMEOUT_SECONDS-60}
  KNOWLEDGE_MAX_DOCUMENT_RETRIES: ${KNOWLEDGE_MAX_DOCUMENT_RETRIES-3}
  KNOWLEDGE_RETRY_BASE_DELAY_SECONDS: ${KNOWLEDGE_RETRY_BASE_DELAY_SECONDS-5}
  KNOWLEDGE_RETRY_BACKOFF_FACTOR: ${KNOWLEDGE_RETRY_BACKOFF_FACTOR-6}
  KNOWLEDGE_MIN_CONTENT_CHARS: ${KNOWLEDGE_MIN_CONTENT_CHARS-100}

  # Analytics.
  COST_PER_MILLION_INPUT_TOKENS: ${COST_PER_MILLION_INPUT_TOKENS-0.30}
  COST_PER_MILLION_OUTPUT_TOKENS: ${COST_PER_MILLION_OUTPUT_TOKENS-1.50}

  # RAG pipeline.
  RAG_PROMPT_VERSION: ${RAG_PROMPT_VERSION-1}
  CHAT_TOP_K: ${CHAT_TOP_K-5}
  CHAT_MEMORY_TURNS: ${CHAT_MEMORY_TURNS-8}
  CHAT_CONTEXT_CHUNK_CHARS: ${CHAT_CONTEXT_CHUNK_CHARS-4000}
  CHAT_CONTEXT_MAX_CHARS: ${CHAT_CONTEXT_MAX_CHARS-20000}
  CHAT_CONTEXT_MIN_SCORE: ${CHAT_CONTEXT_MIN_SCORE-0.25}
  CHAT_QUESTION_MAX_CHARS: ${CHAT_QUESTION_MAX_CHARS-2000}
  CHAT_MAX_OUTPUT_TOKENS: ${CHAT_MAX_OUTPUT_TOKENS-1024}
  CHAT_TEMPERATURE: ${CHAT_TEMPERATURE-0.2}
  GENERATION_TIMEOUT_SECONDS: ${GENERATION_TIMEOUT_SECONDS-60}
  GENERATION_FIRST_TOKEN_TIMEOUT_SECONDS: ${GENERATION_FIRST_TOKEN_TIMEOUT_SECONDS-10}
  CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS-90}
  USAGE_RETENTION_DAYS: ${USAGE_RETENTION_DAYS-1095}
  ENABLE_HYBRID_SEARCH: ${ENABLE_HYBRID_SEARCH-false}
  HYBRID_RRF_K: ${HYBRID_RRF_K-60}
  HYBRID_SEARCH_CANDIDATE_LIMIT: ${HYBRID_SEARCH_CANDIDATE_LIMIT-50}
  ENABLE_RERANKING: ${ENABLE_RERANKING-true}
  RERANK_TOP_K: ${RERANK_TOP_K-5}
  ENABLE_ADAPTIVE_RETRIEVAL: ${ENABLE_ADAPTIVE_RETRIEVAL-false}
  ADAPTIVE_SIMPLE_TOP_K: ${ADAPTIVE_SIMPLE_TOP_K-4}
  ADAPTIVE_SIMPLE_RERANK_TOP_K: ${ADAPTIVE_SIMPLE_RERANK_TOP_K-3}
  ADAPTIVE_SIMPLE_MAX_CONTEXT_CHARS: ${ADAPTIVE_SIMPLE_MAX_CONTEXT_CHARS-8000}
  ADAPTIVE_COMPLEX_TOP_K: ${ADAPTIVE_COMPLEX_TOP_K-12}
  ADAPTIVE_COMPLEX_RERANK_TOP_K: ${ADAPTIVE_COMPLEX_RERANK_TOP_K-8}
  ADAPTIVE_COMPLEX_MAX_CONTEXT_CHARS: ${ADAPTIVE_COMPLEX_MAX_CONTEXT_CHARS-30000}
  ENABLE_FAITHFULNESS_CHECK: ${ENABLE_FAITHFULNESS_CHECK-true}
  FAITHFULNESS_WARNING_THRESHOLD: ${FAITHFULNESS_WARNING_THRESHOLD-0.6}
  ENABLE_RAG_CONFIDENCE_CHECK: ${ENABLE_RAG_CONFIDENCE_CHECK-false}
  RAG_CONFIDENCE_THRESHOLD: ${RAG_CONFIDENCE_THRESHOLD-0.3}
  ENABLE_CONTEXT_OPTIMIZATION: ${ENABLE_CONTEXT_OPTIMIZATION-false}
  EMBEDDING_CACHE_SIZE: ${EMBEDDING_CACHE_SIZE-256}
  EMBEDDING_CACHE_TTL_SECONDS: ${EMBEDDING_CACHE_TTL_SECONDS-3600}
  CHAT_RETRIEVAL_CACHE_SIZE: ${CHAT_RETRIEVAL_CACHE_SIZE-512}
  CHAT_RETRIEVAL_CACHE_TTL_SECONDS: ${CHAT_RETRIEVAL_CACHE_TTL_SECONDS-900}
  CHAT_EMBEDDING_MAX_RETRIES: ${CHAT_EMBEDDING_MAX_RETRIES-1}
  SSE_BUFFER_MS: ${SSE_BUFFER_MS-50}

  # Ingestion engine (crawler).
  CRAWL_MAX_PAGES: ${CRAWL_MAX_PAGES-50}
  CRAWL_MAX_DEPTH: ${CRAWL_MAX_DEPTH-3}
  CRAWL_NAVIGATION_TIMEOUT_MS: ${CRAWL_NAVIGATION_TIMEOUT_MS-30000}
  CRAWL_MAX_HTML_BYTES: ${CRAWL_MAX_HTML_BYTES-5000000}
  CRAWL_MAX_CONTENT_BYTES: ${CRAWL_MAX_CONTENT_BYTES-200000}
  CRAWL_MAX_CONCURRENT: ${CRAWL_MAX_CONCURRENT-2}
  CRAWL_BROWSER_USER_AGENT: ${CRAWL_BROWSER_USER_AGENT-WebChatAI-Crawler/1.0}
  CRAWL_NO_SANDBOX: ${CRAWL_NO_SANDBOX-true}

  # Payments (from .env when present; safe dev fallbacks otherwise).
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER-mock}
  PAYMENT_CURRENCY: ${PAYMENT_CURRENCY-USD}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET-}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET-}

  # Admin.
  SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS-[]}

networks:
  webchat:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: ${DOCKER_BRIDGE_MTU:-1500}

volumes:
  mongo_data:
  redis_data:

services:

  mongo:
    image: mongo:7
    container_name: webchat-mongo
    networks: [webchat]
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: webchat-redis
    networks: [webchat]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: webchat-mailpit
    networks: [webchat]
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      network: host
    container_name: webchat-api
    networks: [webchat]
    restart: unless-stopped
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
      network: host
    container_name: webchat-worker
    networks: [webchat]
    restart: unless-stopped
    environment:
      <<: *backend-env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
      network: host
      args:
        # Inlined into the Next.js client bundle at build time. The value comes
        # from the selected env file (defaults to the local dev API).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-http://localhost:8000}
    container_name: webchat-dashboard
    networks: [webchat]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  widget:
    build:
      context: ..
      dockerfile: docker/Dockerfile.widget
      network: host
      args:
        # Build-time widget API base. Keep EMPTY for local dev AND local
        # production testing: the bundle must stay loopback-free
        # (apps/widget/scripts/check-assets.mjs). The widget reaches the API at
        # runtime via data-api-base-url from WIDGET_API_BASE_URL. Set this to
        # the HTTPS API origin before the production build (Railway).
        VITE_WIDGET_API_BASE_URL: ${VITE_WIDGET_API_BASE_URL-}
    container_name: webchat-widget
    networks: [webchat]
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1/webchat-widget.iife.min.js"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
