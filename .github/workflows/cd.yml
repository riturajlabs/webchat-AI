# CD: publish immutable images to GHCR (./publish) and deploy a production
# Docker-Compose stack from those images (./deploy, manual dispatch).
#
# Immutability: every image is tagged with the git SHA, so a rollout is a
# predictable tag swap and a rollback is re-pointing to a previously-known-good
# SHA (see scripts/deploy.sh rollback) — no rebuilds, no drift.
#
# Publish environment:
#   Repo variable NEXT_PUBLIC_API_URL must hold the PUBLIC HTTPS API origin the
#   dashboard bundle bakes at build time (e.g. https://api.example.com). The
#   build gate (apps/dashboard/scripts/check-production-env.mjs) REJECTS
#   loopback / .example hosts, so the publish job fails instead of silently
#   shipping a broken bundle. VITE_WIDGET_API_BASE_URL must ALSO be set to the
#   public HTTPS API origin (widget SDK bundle), and WIDGET_SCRIPT_URL /
#   WIDGET_API_BASE_URL / CORS_ORIGINS / ALLOWED_HOSTS come from .env.production
#   on the deploy host.
#
# Deploy environment:
#   Requires SSH access to the deploy host (secrets SSH_HOST / SSH_USER /
#   SSH_KEY) and .env.production with real secrets installed there. Runs
#   scripts/deploy.sh (preflight -> pull -> migration -> rollout -> health wait).

name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish images to GHCR (sha-tagged)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE_NAMESPACE="${GITHUB_REPOSITORY,,}"
          echo "namespace=${IMAGE_NAMESPACE}" >> "$GITHUB_OUTPUT"
          SHA_TAG="sha-${GITHUB_SHA}"
          TAGS="ghcr.io/${IMAGE_NAMESPACE}/webchat-ai-api:${SHA_TAG}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS},ghcr.io/${IMAGE_NAMESPACE}/webchat-ai-api:${{ github.ref_name }}"
          else
            TAGS="${TAGS},ghcr.io/${IMAGE_NAMESPACE}/webchat-ai-api:latest"
          fi
          echo "api_tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "worker_tags=${TAGS//api/worker}" >> "$GITHUB_OUTPUT"
          echo "dashboard_tags=${TAGS//api/dashboard}" >> "$GITHUB_OUTPUT"
          echo "widget_tags=${TAGS//api/widget}" >> "$GITHUB_OUTPUT"

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.tags.outputs.api_tags }}
          cache-from: type=gha,scope=webchat-api
          cache-to: type=gha,mode=max,scope=webchat-api

      - name: Build & push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          tags: ${{ steps.tags.outputs.worker_tags }}
          cache-from: type=gha,scope=webchat-worker
          cache-to: type=gha,mode=max,scope=webchat-worker

      - name: Build & push Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dashboard
          push: true
          tags: ${{ steps.tags.outputs.dashboard_tags }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            WEBCHAT_ALLOW_LOCALHOST_BUILD=false
          cache-from: type=gha,scope=webchat-dashboard
          cache-to: type=gha,mode=max,scope=webchat-dashboard

      - name: Build & push Widget image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.widget
          push: true
          tags: ${{ steps.tags.outputs.widget_tags }}
          build-args: |
            VITE_WIDGET_API_BASE_URL=${{ vars.VITE_WIDGET_API_BASE_URL }}
          cache-from: type=gha,scope=webchat-widget
          cache-to: type=gha,mode=max,scope=webchat-widget

  scan:
    name: Scan published images (Trivy)
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      # Same immutable-SHA pin as ci.yml: trivy-action v0.35.0 (the one clean
      # release tag after the CVE-2026-33634 compromise force-pushed the
      # 0.0.1..0.34.2 tags to malware). SHA pinning prevents a poisoned/moved
      # tag from injecting code into the deploy pipeline.
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute canonical image namespace
        run: echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Scan API image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAMESPACE }}/webchat-ai-api:sha-${{ needs.publish.outputs.image_tag }}
          format: sarif
          output: trivy-api.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan Worker image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAMESPACE }}/webchat-ai-worker:sha-${{ needs.publish.outputs.image_tag }}
          format: sarif
          output: trivy-worker.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan Dashboard image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAMESPACE }}/webchat-ai-dashboard:sha-${{ needs.publish.outputs.image_tag }}
          format: sarif
          output: trivy-dashboard.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan Widget image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAMESPACE }}/webchat-ai-widget:sha-${{ needs.publish.outputs.image_tag }}
          format: sarif
          output: trivy-widget.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .
          category: trivy

  deploy:
    name: Deploy production Docker-Compose stack
    runs-on: ubuntu-latest
    needs: [publish, scan]
    environment: production
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    env:
      DEPLOY_HOST: ${{ secrets.SSH_HOST }}
      DEPLOY_USER: ${{ secrets.SSH_USER }}
      DEPLOY_KEY: ${{ secrets.SSH_KEY }}
      IMAGE_TAG: sha-${{ needs.publish.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute canonical image namespace
        run: echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Self-skip when SSH target is not configured
        if: env.DEPLOY_HOST == '' || env.DEPLOY_USER == '' || env.DEPLOY_KEY == ''
        run: |
          echo "No SSH target configured (SSH_HOST/SSH_USER/SSH_KEY secrets unset)."
          echo "Images are published; deploy manually with:"
          echo ""
          echo "  scp -r . user@host:/opt/webchat-ai  # repo + .env.production"
          echo "  ssh user@host 'cd /opt/webchat-ai && IMAGE_TAG=${IMAGE_TAG} scripts/deploy.sh deploy --tag ${IMAGE_TAG} --namespace ${IMAGE_NAMESPACE}'"

      - name: Deploy (migrate + rollout + health wait)
        if: env.DEPLOY_HOST != '' && env.DEPLOY_USER != '' && env.DEPLOY_KEY != ''
        run: |
          mkdir -p "$HOME/.ssh"
          echo "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd /opt/webchat-ai && git fetch origin ${GITHUB_SHA} && git checkout ${GITHUB_SHA} && \
             IMAGE_REGISTRY=ghcr.io IMAGE_NAMESPACE=${IMAGE_NAMESPACE} \
             scripts/deploy.sh deploy --env-file .env.production --tag ${IMAGE_TAG} --registry ghcr.io --namespace ${IMAGE_NAMESPACE}"