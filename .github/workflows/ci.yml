name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Typecheck (mypy)
        run: uv run mypy backend

      - name: Test (pytest)
        run: uv run pytest --cov=backend --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Frontend (lint · typecheck · build · test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Node 24 runtime: bump from the deprecated Node 20 majors (checkout v4 /
      # pnpm v4 / setup-node v4) to their Node-24 based releases. Kept consistent
      # with the project runtime (node:22 and node-version: 22 still work fine).
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  validate:
    name: Security & infra validation (secrets · compose · hardening)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Secret scan (never track .env / secrets)
        run: scripts/check-secrets.sh

      - name: Docker security posture
        run: scripts/check-docker-security.sh

      - name: Compose file validation (base)
        run: docker compose -f docker/compose.yml config --quiet

      - name: Compose file validation (base + production overlay)
        run: docker compose --env-file .env.production.example -f docker/compose.yml -f docker/compose.prod.yml config --quiet

      - name: Production env template passes config.py validators
        run: |
          cp .env.production.example /tmp/env.prod
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=0123456789abcdef$(openssl rand -hex 20)|" /tmp/env.prod
          uv run python -c "
          import sys; sys.path.insert(0, '.')
          from backend.core.config import Settings
          s = Settings(_env_file='/tmp/env.prod')
          assert s.environment == 'production', s.environment
          assert s.enable_docs is False, 'ENABLE_DOCS must be false in production'
          assert s.rate_limit_enabled is True, 'RATE_LIMIT_ENABLED must be true'
          print('production env template passes config.py validators')
          "

  docker:
    name: Docker (build cached · scan with Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        # v4 → Node 24 runtime (v3 targeted Node 20, deprecated).
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Require NEXT_PUBLIC_API_URL (production-style build)
        # The dashboard bundle inlines NEXT_PUBLIC_API_URL into the client at
        # build time. It must come from the GitHub repository variable (same
        # canonical source CD uses). We fail fast and loudly if it is missing —
        # never silently fall back to localhost (the build-time guard rejects it
        # anyway; this gives a clear, actionable error first).
        if: ${{ vars.NEXT_PUBLIC_API_URL == '' }}
        run: |
          echo "::error::CI docker build requires the repository variable NEXT_PUBLIC_API_URL set to the public HTTPS API origin (e.g. https://api.your-domain.com). Settings > Secrets and variables > Actions > Variables -> NEXT_PUBLIC_API_URL, then re-run."
          exit 1

      - name: Build API image (cached)
        # v7 → Node 24 runtime (v6 targeted Node 20, deprecated).
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.api
          tags: webchat-api:ci
          load: true
          cache-from: type=gha,scope=webchat-api
          cache-to: type=gha,mode=max,scope=webchat-api

      - name: Build Worker image (cached)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.worker
          tags: webchat-worker:ci
          load: true
          cache-from: type=gha,scope=webchat-worker
          cache-to: type=gha,mode=max,scope=webchat-worker

      - name: Build Dashboard image (cached)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.dashboard
          tags: webchat-dashboard:ci
          load: true
          # Same canonical source as CD: the repository variable
          # NEXT_PUBLIC_API_URL (public HTTPS API origin) is baked into the
          # Next.js client bundle. WEBCHAT_ALLOW_LOCALHOST_BUILD stays "false"
          # so the loopback/placeholder build guard is never relaxed.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            WEBCHAT_ALLOW_LOCALHOST_BUILD=false
          cache-from: type=gha,scope=webchat-dashboard
          cache-to: type=gha,mode=max,scope=webchat-dashboard

      - name: Build Widget image (cached)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.widget
          tags: webchat-widget:ci
          load: true
          cache-from: type=gha,scope=webchat-widget
          cache-to: type=gha,mode=max,scope=webchat-widget

      # Container vulnerability scanning. Fails on HIGH/CRITICAL findings with a
      # fix available (--ignore-unfixed) to avoid false failures from base-image
      # backports that the distro has not yet shipped. SARIF is uploaded so
      # findings surface in the GitHub Security tab.
      #
      # The action is pinned to the immutable SHA of trivy-action v0.36.0 (the
      # first safe release after the CVE-2026-33634 supply-chain compromise that
      # force-pushed the 0.0.1..0.34.2 tags to malware). SHA pinning is required
      # so a moved/poisoned tag can never inject code into CI.
      - name: Scan API image (Trivy)
        id: trivy-api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: webchat-api:ci
          format: sarif
          output: trivy-api.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan Worker image (Trivy)
        id: trivy-worker
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: webchat-worker:ci
          format: sarif
          output: trivy-worker.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan Dashboard image (Trivy)
        id: trivy-dashboard
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: webchat-dashboard:ci
          format: sarif
          output: trivy-dashboard.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan Widget image (Trivy)
        id: trivy-widget
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: webchat-widget:ci
          format: sarif
          output: trivy-widget.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        # always() so findings still get uploaded after a scan reports
        # HIGH/CRITICAL (continue-on-error on the scans); hashFiles gates on
        # actual SARIF output existing at runtime. If the Docker build failed
        # before scans ran (no SARIF files), this is skipped cleanly — no
        # misleading secondary failure. The Trivy gate step below still fails
        # the job on any real HIGH/CRITICAL finding.
        if: always() && hashFiles('trivy-*.sarif') != ''
        # Pinned to the immutable SHA of github/codeql-action v4 (the current
        # maintained major; v3 is deprecated Dec 2026). SHA-pinned to match the
        # repo's supply-chain policy for security-sensitive actions.
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9 (commit SHA)
        with:
          sarif_file: .
          category: trivy

      - name: Trivy gate (fail on HIGH/CRITICAL)
        # Only enforce the gate when scans actually ran (SARIF was produced —
        # trivy writes SARIF even when it finds HIGH/CRITICAL with a fix, then
        # exits 1). If no SARIF exists the Docker build failed before scans ran;
        # that earlier build failure already fails the job, so we skip without a
        # misleading secondary failure.
        if: always()
        run: |
          if ls trivy-*.sarif 1>/dev/null 2>&1; then
            for result in \
              "${{ steps.trivy-api.outcome }}" \
              "${{ steps.trivy-worker.outcome }}" \
              "${{ steps.trivy-dashboard.outcome }}" \
              "${{ steps.trivy-widget.outcome }}"; do
              if [ "$result" = "failure" ]; then
                echo "::error::Trivy detected HIGH/CRITICAL vulnerabilities with a fix available. Review the SARIF upload in the Security tab."
                exit 1
              fi
            done
            echo "All Trivy scans passed (no HIGH/CRITICAL with fix available)."
          else
            echo "No SARIF output produced (scans did not run; build failed earlier). Skipping Trivy gate — job already failed on the build step."
          fi

  # Widget E2E (Playwright) - full no-mock flow via scripts/e2e-widget.sh.
  #
  # Required services (docker/compose.yml):
  #   mongo, redis, mailpit, api, worker, widget
  # Required secrets:
  #   GEMINI_API_KEY - real embeddings for the crawl + RAG answer stream.
  #
  # The job self-skips when GEMINI_API_KEY is not configured so a fork/PR
  # without the secret never breaks the pipeline; it is gated on the
  # backend+frontend jobs passing to avoid burning resources on a red tree.
  widget-e2e:
    name: Widget E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Skip when GEMINI_API_KEY is not configured
        if: env.GEMINI_API_KEY == ''
        run: echo "GEMINI_API_KEY secret not set - skipping widget E2E"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install Playwright browser
        run: uv run python -m playwright install --with-deps chromium

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision .env.development for the E2E stack
        if: env.GEMINI_API_KEY != ''
        run: |
          cp .env.example .env.development
          # Real key for embeddings (never echo it).
          sed -i 's|^GEMINI_API_KEY=.*|GEMINI_API_KEY='"${GEMINI_API_KEY}"'|' .env.development
          sed -i 's|^RATE_LIMIT_ENABLED=.*|RATE_LIMIT_ENABLED=false|' .env.development || true

      - name: Run widget E2E (full no-mock flow)
        if: env.GEMINI_API_KEY != ''
        run: scripts/e2e-widget.sh