name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Typecheck (mypy)
        run: uv run mypy backend

      - name: Test (pytest)
        run: uv run pytest --cov=backend --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Frontend (lint · typecheck · build · test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  validate:
    name: Security & infra validation (secrets · compose · hardening)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Secret scan (never track .env / secrets)
        run: scripts/check-secrets.sh

      - name: Docker security posture
        run: scripts/check-docker-security.sh

      - name: Compose file validation (base)
        run: docker compose -f docker/compose.yml config --quiet

      - name: Compose file validation (base + production overlay)
        run: docker compose --env-file .env.production.example -f docker/compose.yml -f docker/compose.prod.yml config --quiet

      - name: Production env template passes config.py validators
        run: |
          cp .env.production.example /tmp/env.prod
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=0123456789abcdef$(openssl rand -hex 20)|" /tmp/env.prod
          uv run python -c "
          import sys; sys.path.insert(0, '.')
          from backend.core.config import Settings
          s = Settings(_env_file='/tmp/env.prod')
          assert s.environment == 'production', s.environment
          assert s.enable_docs is False, 'ENABLE_DOCS must be false in production'
          assert s.rate_limit_enabled is True, 'RATE_LIMIT_ENABLED must be true'
          print('production env template passes config.py validators')
          "

  docker:
    name: Docker (build cached · scan with Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          tags: webchat-api:ci
          load: true
          cache-from: type=gha,scope=webchat-api
          cache-to: type=gha,mode=max,scope=webchat-api

      - name: Build Worker image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker
          tags: webchat-worker:ci
          load: true
          cache-from: type=gha,scope=webchat-worker
          cache-to: type=gha,mode=max,scope=webchat-worker

      - name: Build Dashboard image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dashboard
          tags: webchat-dashboard:ci
          load: true
          cache-from: type=gha,scope=webchat-dashboard
          cache-to: type=gha,mode=max,scope=webchat-dashboard

      - name: Build Widget image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.widget
          tags: webchat-widget:ci
          load: true
          cache-from: type=gha,scope=webchat-widget
          cache-to: type=gha,mode=max,scope=webchat-widget

      # Container vulnerability scanning. Fails on HIGH/CRITICAL findings with a
      # fix available (--ignore-unfixed) to avoid false failures from base-image
      # backports that the distro has not yet shipped. SARIF is uploaded so
      # findings surface in the GitHub Security tab.
      #
      # The action is pinned to the immutable SHA of trivy-action v0.35.0 (the
      # only release tag left untouched by the CVE-2026-33634 supply-chain
      # compromise that force-pushed the 0.0.1..0.34.2 tags to malware). SHA
      # pinning is required so a moved/poisoned tag can never inject code into CI.
      - name: Scan API image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: webchat-api:ci
          format: sarif
          output: trivy-api.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan Worker image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: webchat-worker:ci
          format: sarif
          output: trivy-worker.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan Dashboard image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: webchat-dashboard:ci
          format: sarif
          output: trivy-dashboard.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan Widget image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: webchat-widget:ci
          format: sarif
          output: trivy-widget.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .
          category: trivy

  # Widget E2E (Playwright) - full no-mock flow via scripts/e2e-widget.sh.
  #
  # Required services (docker/compose.yml):
  #   mongo, redis, mailpit, api, worker, widget
  # Required secrets:
  #   GEMINI_API_KEY - real embeddings for the crawl + RAG answer stream.
  #
  # The job self-skips when GEMINI_API_KEY is not configured so a fork/PR
  # without the secret never breaks the pipeline; it is gated on the
  # backend+frontend jobs passing to avoid burning resources on a red tree.
  widget-e2e:
    name: Widget E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Skip when GEMINI_API_KEY is not configured
        if: env.GEMINI_API_KEY == ''
        run: echo "GEMINI_API_KEY secret not set - skipping widget E2E"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install Playwright browser
        run: uv run python -m playwright install --with-deps chromium

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision .env.development for the E2E stack
        if: env.GEMINI_API_KEY != ''
        run: |
          cp .env.example .env.development
          # Real key for embeddings (never echo it).
          sed -i 's|^GEMINI_API_KEY=.*|GEMINI_API_KEY='"${GEMINI_API_KEY}"'|' .env.development
          sed -i 's|^RATE_LIMIT_ENABLED=.*|RATE_LIMIT_ENABLED=false|' .env.development || true

      - name: Run widget E2E (full no-mock flow)
        if: env.GEMINI_API_KEY != ''
        run: scripts/e2e-widget.sh