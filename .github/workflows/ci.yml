name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Typecheck (mypy)
        run: uv run mypy backend

      - name: Test (pytest)
        run: uv run pytest --cov=backend --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Frontend (lint · typecheck · build · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  docker:
    name: Docker (build images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t webchat-api:ci .

      - name: Build Worker image
        run: docker build -f docker/Dockerfile.worker -t webchat-worker:ci .

      - name: Build Dashboard image
        run: docker build -f docker/Dockerfile.dashboard -t webchat-dashboard:ci .

      - name: Build Widget image
        run: docker build -f docker/Dockerfile.widget -t webchat-widget:ci .

  # Widget E2E (Playwright) - full no-mock flow via scripts/e2e-widget.sh.
  #
  # Required services (docker/compose.yml):
  #   mongo, redis, mailpit, api, worker, widget
  # Required secrets:
  #   GEMINI_API_KEY - real embeddings for the crawl + RAG answer stream.
  #
  # The job self-skips when GEMINI_API_KEY is not configured so a fork/PR
  # without the secret never breaks the pipeline; it is gated on the
  # backend+frontend jobs passing to avoid burning resources on a red tree.
  widget-e2e:
    name: Widget E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip when GEMINI_API_KEY is not configured
        if: env.GEMINI_API_KEY == ''
        run: echo "GEMINI_API_KEY secret not set - skipping widget E2E"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install Playwright browser
        run: uv run python -m playwright install --with-deps chromium

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision .env.development for the E2E stack
        if: env.GEMINI_API_KEY != ''
        run: |
          cp .env.example .env.development
          # Real key for embeddings (never echo it).
          sed -i 's|^GEMINI_API_KEY=.*|GEMINI_API_KEY='"${GEMINI_API_KEY}"'|' .env.development
          sed -i 's|^RATE_LIMIT_ENABLED=.*|RATE_LIMIT_ENABLED=false|' .env.development || true

      - name: Run widget E2E (full no-mock flow)
        if: env.GEMINI_API_KEY != ''
        run: scripts/e2e-widget.sh
